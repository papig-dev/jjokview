name: Jjokview
options:
  bundleIdPrefix: dev.papig
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en          # 이중언어(en/ko): Localizable.xcstrings + InfoPlist.strings

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: GBN9T65259   # papig.dev 공통 팀
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64                   # Apple Silicon(M1+) 전용
    ONLY_ACTIVE_ARCH: NO

targets:
  Jjokview:
    type: application
    platform: macOS
    sources:
      - path: Jjokview
        excludes:
          - "CLibArchive/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.papig.jjokview
        PRODUCT_NAME: Jjokview
        INFOPLIST_FILE: Jjokview/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jjokview/App/Jjokview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Jjokview/CLibArchive   # 시스템 libarchive(RAR/7z)를 헤더 직접 선언으로 링크
        OTHER_LDFLAGS: -larchive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  JjokviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - JjokviewTests
    dependencies:
      - target: Jjokview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.papig.jjokview.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Jjokview.app/Contents/MacOS/Jjokview
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Jjokview/CLibArchive

schemes:
  Jjokview:
    build:
      targets:
        Jjokview: all
        JjokviewTests: [test]
    test:
      targets:
        - JjokviewTests
